name: Continuation source snapshot
on:
  push:
    branches: [chore/continuation-source-20261001]
    paths: [.github/workflows/continuation-snapshot.yml]
permissions:
  contents: read
  issues: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 070f3eea34cb59a849412b0e8c9f8c594aecbb52
          persist-credentials: false
      - name: Snapshot tracked source
        run: |
          mkdir -p /tmp/ams-source
          git archive --format=tar.gz -o /tmp/ams-source/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/ams-source/HEAD.txt
      - name: Snapshot backlog for dependency ordering
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,os,urllib.request,pathlib
          rows=[]
          for page in range(1,5):
              url=f'https://api.github.com/repos/wdmahbubur/accounts-management-solution/issues?state=all&per_page=100&page={page}'
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: data=json.load(response)
              rows.extend({k:i.get(k) for k in ('number','title','body','state','html_url','labels','pull_request')} for i in data)
              if len(data)<100: break
          pathlib.Path('/tmp/ams-source/issues.json').write_text(json.dumps(rows))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuation-source
          path: /tmp/ams-source
          retention-days: 1
