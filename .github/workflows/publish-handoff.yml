name: Publish documentation and implementation backlog

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/handoff/publish-request.json'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-ams-handoff
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wdmahbubur/accounts-management-solution'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch the exact requested repository revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify source archive and publish requested documentation and issues
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          python .github/handoff/publish.py
      - name: Report publication status
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ams-publication-summary.md ]; then
            cat /tmp/ams-publication-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
