name: Bootstrap npm lockfile

on:
  push:
    branches: [feat/us-002-bootstrap-toolchain-ci]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1

      - name: Use pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve exact dependency graph
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependencies"
          git push
