name: Bootstrap US-003 migrations

on:
  push:
    branches: [feat/us-003-versioned-migrations]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Discover CLI commands
        run: |
          supabase --version
          supabase --help
          supabase init --help
          supabase migration --help
          supabase migration new --help

      - name: Initialize local Supabase project
        run: supabase init

      - name: Create migration files with Supabase CLI
        id: migrations
        run: |
          core_output="$(supabase migration new core_finance_schema)"
          security_output="$(supabase migration new read_only_security_baseline)"
          printf '%s\n' "$core_output"
          printf '%s\n' "$security_output"
          core_path="$(printf '%s\n' "$core_output" | sed -n 's/^Created new migration at //p')"
          security_path="$(printf '%s\n' "$security_output" | sed -n 's/^Created new migration at //p')"
          test -n "$core_path"
          test -n "$security_path"
          echo "core_path=$core_path" >> "$GITHUB_OUTPUT"
          echo "security_path=$security_path" >> "$GITHUB_OUTPUT"

      - name: Split reviewed reference into ordered migrations
        env:
          CORE_PATH: ${{ steps.migrations.outputs.core_path }}
          SECURITY_PATH: ${{ steps.migrations.outputs.security_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path("docs/reference-schema.sql").read_text()
          marker = "-- Hardened membership/permission lookup. Keep finance_private outside exposed schemas."
          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one migration split marker")

          before, after = source.split(marker, 1)

          header_end = before.index("BEGIN;")
          source_header = before[:header_end].rstrip()
          core_body = before[header_end + len("BEGIN;"):].strip()

          security_body = (marker + after).strip()
          if not security_body.endswith("COMMIT;"):
              raise SystemExit("Reference SQL no longer ends with COMMIT;")
          security_body = security_body[:-len("COMMIT;")].rstrip()

          core = f"""-- US-003 migration 1/2: core finance schema.
          -- Generated through Supabase CLI from docs/reference-schema.sql.
          -- Field and constraint definitions are intentionally preserved verbatim.
          {source_header}
          BEGIN;
          {core_body}
          COMMIT;
          """
          security = f"""-- US-003 migration 2/2: read-only security baseline.
          -- Generated through Supabase CLI from docs/reference-schema.sql.
          -- No ordinary API-user write grants are introduced.
          BEGIN;
          {security_body}
          COMMIT;
          """

          Path(os.environ["CORE_PATH"]).write_text(core)
          Path(os.environ["SECURITY_PATH"]).write_text(security)
          PY

      - name: Commit generated Supabase project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase
          git commit -m "chore: generate US-003 Supabase migrations"
          git push
