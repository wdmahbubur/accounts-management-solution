name: Repair US-003 migration ordering

on:
  push:
    branches: [feat/us-003-versioned-migrations]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Regenerate second migration with a unique CLI timestamp
        run: |
          old="supabase/migrations/20260930111830_read_only_security_baseline.sql"
          test -f "$old"
          cp "$old" /tmp/security.sql
          rm "$old"
          sleep 2
          output="$(supabase migration new read_only_security_baseline)"
          printf '%s\n' "$output"
          new="$(printf '%s\n' "$output" | sed -n 's/^Created new migration at //p')"
          test -n "$new"
          cp /tmp/security.sql "$new"
          test "$(basename "$new" | cut -d_ -f1)" != "20260930111830"

      - name: Commit ordered migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "fix: give security migration a distinct version"
          git push
