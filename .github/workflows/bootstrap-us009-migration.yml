name: Bootstrap US-009 migration

on:
  push:
    branches: [feat/us-009-capability-roles]

permissions:
  contents: write

jobs:
  migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Generate migration
        run: |
          output="$(supabase migration new capability_roles)"
          printf '%s\n' "$output"
          path="$(printf '%s\n' "$output" | sed -n 's/^Created new migration at //p')"
          test -n "$path"
          echo "-- US-009 capability roles placeholder generated by Supabase CLI." > "$path"
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: generate US-009 capability migration"
          git push
